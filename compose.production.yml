# Hanzo IAM Production Deployment
# Multi-tenant IAM serving: hanzo.id, lux.id, zoo.id, pars.id

services:
  iam:
    image: ghcr.io/hanzoai/iam:1.1000.1
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      RUNNING_IN_DOCKER: "true"
      IAM_DB_HOST: ${IAM_DB_HOST:-postgres}
      IAM_DB_PASSWORD: ${IAM_DB_PASSWORD}
      IAM_REDIS_HOST: ${IAM_REDIS_HOST:-redis}
      IAM_RADIUS_SECRET: ${IAM_RADIUS_SECRET:-secret}
    volumes:
      - ./conf/app.prod.conf:/app/conf/app.conf:ro
      - ./init_data.json:/app/init_data.json:ro
      - iam_logs:/logs
    labels:
      - "traefik.enable=true"
      # Hanzo ID - main IAM
      - "traefik.http.routers.iam-hanzo.rule=Host(`hanzo.id`)"
      - "traefik.http.routers.iam-hanzo.entrypoints=websecure"
      - "traefik.http.routers.iam-hanzo.tls.certresolver=letsencrypt"
      # Lux ID - Lux Network users
      - "traefik.http.routers.iam-lux.rule=Host(`lux.id`)"
      - "traefik.http.routers.iam-lux.entrypoints=websecure"
      - "traefik.http.routers.iam-lux.tls.certresolver=letsencrypt"
      # Zoo ID - Zoo Labs users
      - "traefik.http.routers.iam-zoo.rule=Host(`zoo.id`)"
      - "traefik.http.routers.iam-zoo.entrypoints=websecure"
      - "traefik.http.routers.iam-zoo.tls.certresolver=letsencrypt"
      # Pars ID - Pars Network users
      - "traefik.http.routers.iam-pars.rule=Host(`pars.id`)"
      - "traefik.http.routers.iam-pars.entrypoints=websecure"
      - "traefik.http.routers.iam-pars.tls.certresolver=letsencrypt"
      # Load balancer config
      - "traefik.http.services.iam.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: ghcr.io/hanzoai/sql:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: hanzo
      POSTGRES_PASSWORD: ${IAM_DB_PASSWORD}
      POSTGRES_DB: hanzo_iam
    volumes:
      - iam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanzo -d hanzo_iam"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - iam_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    command:
      - "--api.insecure=false"
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@hanzo.ai"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - iam_letsencrypt:/letsencrypt

volumes:
  iam_postgres_data:
  iam_redis_data:
  iam_logs:
  iam_letsencrypt:
