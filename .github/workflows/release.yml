name: Release

# Release pipeline triggered by semver tags.
#
# Produces ONE canonical artifact:
#   * ghcr.io/hanzoai/iam:vX.Y.Z — multi-arch image (linux/amd64+arm64),
#     built CGO_ENABLED=1 + libsqlcipher via the Dockerfile, so at-rest
#     encryption is REAL and the Dockerfile's ciphertext gate must pass.
#
# We intentionally do NOT ship standalone iam/iamd binaries: a CGO_ENABLED=0
# binary links the pure-Go backend, which CANNOT encrypt — running it with
# IAM_KMS_MASTER_KEY set would hard-error (good) but shipping a plaintext-only
# binary alongside the encrypted image is misleading. The image is the artifact.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.15.0). Must already exist.'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  github-release:
    name: GitHub Release (notes only)
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          echo "tag=${ref}" >> "$GITHUB_OUTPUT"

      # Release notes only — no binary attachments. The canonical, encryption-
      # capable artifact is the ghcr image built by the `docker` job below.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Multi-arch Docker (ghcr.io/hanzoai/iam)
    # The Dockerfile builds the iam server itself (CGO_ENABLED=1 + libsqlcipher),
    # so this is the canonical, encryption-capable artifact that ships to
    # production. Its encryption gate (TestEncryptionProof + TestOrgDBEncryptionPosture)
    # fails the image build if at-rest encryption is not real.
    runs-on: hanzo-build-linux-amd64
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          echo "tag=${ref}" >> "$GITHUB_OUTPUT"
          # Strip leading v for an additional :X.Y.Z tag
          echo "semver=${ref#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: standard
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: |
            ghcr.io/hanzoai/iam:${{ steps.version.outputs.tag }}
            ghcr.io/hanzoai/iam:${{ steps.version.outputs.semver }}
            ghcr.io/hanzoai/iam:latest
          build-args: |
            GO_EXPERIMENT=jsonv2
          secrets: |
            gh_token=${{ secrets.GH_PAT || secrets.UNIVERSE_PAT || secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-universe:
    name: Notify universe (auto-bump pin)
    needs: [docker]
    runs-on: hanzo-build-linux-amd64
    if: github.repository == 'hanzoai/iam'
    steps:
      - name: Resolve version
        id: version
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          echo "tag=${ref}" >> "$GITHUB_OUTPUT"

      - name: Repository dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.UNIVERSE_DISPATCH_TOKEN }}
          repository: hanzoai/universe
          event-type: image-update
          client-payload: |
            {
              "service": "iam",
              "image":   "ghcr.io/hanzoai/iam:${{ steps.version.outputs.tag }}",
              "sha":     "${{ github.sha }}",
              "env":     "all"
            }
