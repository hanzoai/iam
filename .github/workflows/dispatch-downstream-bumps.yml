# Notify downstream wrapper repos when hanzoai/iam publishes a new
# git tag, so they can auto-bump their VERSION + rebuild without
# polling.
#
# Currently notifies:
#   liquidityio/iam (white-label wrapper)
#
# Add more wrappers in the strategy matrix below as they come online.
# The downstream wrapper must accept repository_dispatch with
# event-type=upstream-tag and use client_payload.tag.
name: Dispatch downstream bumps

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to dispatch (e.g. v1.14.19)'
        required: true

jobs:
  notify:
    name: Notify ${{ matrix.repo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - liquidityio/iam
    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Dispatch repository_dispatch event-type=upstream-tag
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_PAT || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ matrix.repo }}
        run: |
          set -euo pipefail
          # Repository dispatch payload — wrapper's upstream-sync.yml
          # reads `client_payload.tag` and bumps VERSION + UPSTREAM_REF.
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/dispatches" \
            -d "{\"event_type\":\"upstream-tag\",\"client_payload\":{\"tag\":\"${TAG}\"}}"
          echo "::notice::dispatched upstream-tag ${TAG} to ${REPO}"
