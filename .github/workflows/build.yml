name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, dev, test]
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:

  go-tests:
    name: Running Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ./go.mod
      - name: Tests
        run: |
          go test -v $(go list ./...) -tags skipCi
        working-directory: ./

  frontend:
    name: Front-end
    runs-on: ubuntu-24.04
    needs: [ go-tests ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install && CI=false NODE_OPTIONS="--max-old-space-size=4096" pnpm run build
        working-directory: ./web
      - name: Upload build artifacts
        if: github.repository == 'hanzoai/iam' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.run_id }}
          path: ./web/build

  backend:
    name: Back-end
    runs-on: ubuntu-24.04
    needs: [ go-tests ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ./go.mod
      - run: go version
      - name: Build
        run: |
          go build -ldflags "-extldflags '-static'"
        working-directory: ./

  linter:
    name: Go-Linter
    runs-on: ubuntu-24.04
    needs: [ go-tests ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Install golangci-lint from source
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: golangci-lint
        run: golangci-lint run --timeout 5m --modules-download-mode=mod

  tag-release:
    name: Create Tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    if: github.repository == 'hanzoai/iam' && github.event_name == 'push'
    needs: [ frontend, backend, linter ]
    outputs:
      new-release-published: ${{ steps.semantic.outputs.new_release_published }}
      new-release-version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # semantic-release-action shells out to npm; the hanzo self-hosted
      # runner image doesn't ship npm, so the action errors with
      # `npm: not found` and the whole release path is skipped silently.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Tag with Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    if: github.repository == 'hanzoai/iam' && github.event_name == 'push' && needs.tag-release.outputs.new-release-published == 'true'
    needs: [ tag-release ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Download frontend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.run_id }}
          path: ./web/build

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ./go.mod

      - name: Prepare Go caches
        run: |
          echo "GOMODCACHE=$RUNNER_TEMP/gomod" >> $GITHUB_ENV
          echo "GOCACHE=$RUNNER_TEMP/gocache" >> $GITHUB_ENV
          go clean -cache -modcache -testcache -fuzzcache

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-release:
    name: Docker Release
    if: github.repository == 'hanzoai/iam' && github.event_name == 'push' && needs.tag-release.outputs.new-release-published == 'true'
    needs: [ tag-release ]
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/iam
      target: standard
      # arm64 ARC pool was uninstalled 2026-04-27 (DOKS has no arm64
      # droplets); the reusable workflow defaults to multi-arch which
      # queues forever. Pin to amd64 only per universe CLAUDE.md
      # "Docker Build Standard (2026-04-27)".
      platforms: linux/amd64
    secrets: inherit

  notify-universe:
    # After a successful image push, dispatch to hanzoai/universe so
    # service-released.yml opens an auto-bump PR for the iam pin.
    name: Notify universe (auto-bump pin)
    runs-on: ubuntu-latest
    if: github.repository == 'hanzoai/iam' && github.event_name == 'push' && needs.tag-release.outputs.new-release-published == 'true'
    needs: [ tag-release, docker-release ]
    steps:
      - name: Repository dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.UNIVERSE_DISPATCH_TOKEN }}
          repository: hanzoai/universe
          event-type: iam
          client-payload: |
            {
              "service": "iam",
              "version": "${{ needs.tag-release.outputs.new-release-version }}",
              "image":   "ghcr.io/hanzoai/iam:${{ needs.tag-release.outputs.new-release-version }}",
              "sha":     "${{ github.sha }}"
            }
