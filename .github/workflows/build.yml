        env:
          POSTGRES_USER: hanzo
          POSTGRES_PASSWORD: hanzo123
          POSTGRES_DB: hanzo
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U hanzo -d hanzo" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: ghcr.io/hanzoai/kv:latest
        ports:
          - 6379:6379
        options: --health-cmd="valkey-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.23'
          cache-dependency-path: ./go.mod
      - name: Create hanzo_iam database
        run: PGPASSWORD=hanzo123 psql -h localhost -U hanzo -d hanzo -c "CREATE DATABASE hanzo_iam OWNER hanzo;"
      - name: Build backend
        run: go build -o server .
        working-directory: ./
      - name: Start backend
        env:
          IAM_ADMIN_PASSWORD: "123"
        run: nohup ./server > /tmp/backend.log 2>&1 &
        working-directory: ./
      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend server to start on port 8000..."
          for i in {1..90}; do
            if curl -s http://localhost:8000 > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            if [ $i -eq 90 ]; then
              echo "Backend failed to start within 90 seconds"
              echo "Backend logs:"
              cat /tmp/backend.log || echo "No backend logs available"
              exit 1
            fi
            echo "Waiting... ($i/90)"
            sleep 1
          done
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install
        working-directory: ./web
      - name: Install Cypress binary
        run: npx cypress install
        working-directory: ./web
      - uses: cypress-io/github-action@v5
        with:
          install-command: pnpm install
          browser: chrome
          start: pnpm start
          wait-on: 'http://localhost:7001'
          wait-on-timeout: 210
          working-directory: ./web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: ./web/cypress/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: ./web/cypress/videos

  tag-release:
    name: Create Tag
    runs-on: hanzo-build
    permissions:
      contents: write
      issues: write
    if: github.repository == 'hanzoai/iam' && github.event_name == 'push'
    needs: [ frontend, backend, linter, e2e ]
    outputs:
      new-release-published: ${{ steps.semantic.outputs.new_release_published }}
      new-release-version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Tag with Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    name: GitHub Release
    runs-on: hanzo-build
    permissions:
      contents: write
      issues: write
    if: github.repository == 'hanzoai/iam' && github.event_name == 'push' && needs.tag-release.outputs.new-release-published == 'true'
    needs: [ tag-release ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Download frontend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.run_id }}
          path: ./web/build

      - name: Prepare Go caches
        run: |
          echo "GOMODCACHE=$RUNNER_TEMP/gomod" >> $GITHUB_ENV
          echo "GOCACHE=$RUNNER_TEMP/gocache" >> $GITHUB_ENV
          go clean -cache -modcache -testcache -fuzzcache

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-release:
    name: Docker Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      packages: write
    if: github.repository == 'hanzoai/iam' && github.event_name == 'push' && needs.tag-release.outputs.new-release-published == 'true'
    needs: [ tag-release ]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: -1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
        with:
          version: latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          target: STANDARD
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/hanzoai/iam:${{ needs.tag-release.outputs.new-release-version }},ghcr.io/hanzoai/iam:latest

      - name: Push All In One Version to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ALLINONE
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/hanzoai/iam-allinone:${{ needs.tag-release.outputs.new-release-version }},ghcr.io/hanzoai/iam-allinone:latest
