name: Docker Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Test gates — broken code does not ship ───────────────────
  go-tests:
    runs-on: hanzo-build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ./go.mod
      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=hanzo -e POSTGRES_PASSWORD=hanzo123 -e POSTGRES_DB=hanzo \
            postgres:18
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U hanzo -d hanzo && break
            sleep 1
          done
      - run: go test -count=1 $(go list ./...) -tags skipCi

  go-lint:
    runs-on: hanzo-build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - run: golangci-lint run --timeout 5m --modules-download-mode=mod

  go-build:
    runs-on: hanzo-build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ./go.mod
      - run: go build -ldflags "-extldflags '-static'" .

  frontend-build:
    runs-on: hanzo-build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: ./web
      - run: CI=false NODE_OPTIONS="--max-old-space-size=4096" pnpm run build
        working-directory: ./web

  # ── Build + deploy (only after all gates pass) ──────────────
  docker:
    needs: [go-tests, go-lint, go-build, frontend-build]
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/iam
      deploy: true
      deploy-deployment: iam
      deploy-namespace: hanzo
      target: standard
    secrets: inherit
