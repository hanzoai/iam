name: Docker Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Test gates — broken code does not ship ───────────────────
  go-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: ghcr.io/hanzoai/sql:latest
        env:
          POSTGRES_USER: hanzo
          POSTGRES_PASSWORD: hanzo123
          POSTGRES_DB: hanzo
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U hanzo -d hanzo" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ./go.mod
      - run: go test -count=1 $(go list ./...) -tags skipCi

  go-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - run: golangci-lint run --disable-all -E=gofumpt --max-same-issues=0 --timeout 5m --modules-download-mode=mod

  go-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ./go.mod
      - run: go build -ldflags "-extldflags '-static'" .

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: ./web
      - run: CI=false NODE_OPTIONS="--max-old-space-size=4096" pnpm run build
        working-directory: ./web

  # ── Build + deploy (only after all gates pass) ──────────────
  docker:
    needs: [go-tests, go-lint, go-build, frontend-build]
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/iam
      deploy: true
      deploy-deployment: iam
      deploy-namespace: hanzo
      target: standard
    secrets: inherit
