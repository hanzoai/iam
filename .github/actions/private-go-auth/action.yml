name: 'Private Go module access'
description: >-
  Authenticate git to the private github.com/{luxfi,hanzoai,zooai} Go modules
  (authz, beego, kms, crypto, …) using a FRESH GIT_CONFIG_GLOBAL that is immune
  to self-hosted-runner state, and export GOPRIVATE to the rest of the job.
inputs:
  token:
    description: 'PAT with read access to the private orgs (luxfi, hanzoai, zooai).'
    required: true
runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        GH_PAT: ${{ inputs.token }}
      run: |
        : "${GH_PAT:?token input is empty — set an org PAT with luxfi+hanzoai read}"
        # Self-hosted arc runners share ~/.gitconfig between runs; a stale
        # insteadOf/credential from a prior job overrides ours and yields
        # "Invalid username or token". A fresh per-job GIT_CONFIG_GLOBAL
        # (the same trick the Dockerfile uses) makes go's module fetch immune.
        CFG="$RUNNER_TEMP/gitconfig-private"; : > "$CFG"
        GIT_CONFIG_GLOBAL="$CFG" git config --global \
          url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
        {
          echo "GIT_CONFIG_GLOBAL=$CFG"
          echo "GIT_CONFIG_NOSYSTEM=1"
          echo "GOPRIVATE=github.com/luxfi,github.com/hanzoai,github.com/zooai"
        } >> "$GITHUB_ENV"
        # Fail loud + early if the token can't actually read a private repo,
        # rather than 20 confusing "exit status 128" lines mid go-test. Probe
        # one repo per private org so the failure says exactly which org.
        #
        # Run the probe from a NEUTRAL dir ($RUNNER_TEMP), NOT the checked-out
        # repo: actions/checkout persists `http.https://github.com/.extraheader`
        # (the repo-scoped GITHUB_TOKEN) in the repo's local .git/config, which
        # would override our URL credentials and falsely fail. go fetches modules
        # in GOMODCACHE (also outside this repo), so the neutral-dir probe matches
        # go's real environment.
        for r in hanzoai/authz luxfi/kms; do
          if ( cd "$RUNNER_TEMP" && GIT_CONFIG_GLOBAL="$CFG" GIT_CONFIG_NOSYSTEM=1 git ls-remote "https://github.com/$r" >/dev/null 2>&1 ); then
            echo "private-module git auth OK: $r"
          else
            echo "::error::private-module git auth FAILED for $r — real git error below:"
            ( cd "$RUNNER_TEMP" && GIT_CONFIG_GLOBAL="$CFG" GIT_CONFIG_NOSYSTEM=1 git ls-remote "https://github.com/$r" 2>&1 | sed 's/x-access-token:[^@]*@/x-access-token:***@/g' | head -4 )
            exit 1
          fi
        done
