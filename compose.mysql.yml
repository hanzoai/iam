# Hanzo IAM Local Development with MySQL
# Usage: docker compose -f compose.mysql.yml up

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: hanzo123
      MYSQL_DATABASE: hanzo_iam
      MYSQL_USER: hanzo
      MYSQL_PASSWORD: hanzo123
    ports:
      - "3306:3306"
    volumes:
      - iam_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ghcr.io/hanzoai/kv:latest
    ports:
      - "6379:6379"
    command: valkey-server --appendonly yes
    volumes:
      - iam_redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  iam_mysql_data:
  iam_redis_data:
