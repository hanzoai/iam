# Hanzo IAM — local dev (Base/SQLite embedded, no Postgres/Redis).
#
# Same shape as compose.yml but: builds locally, no init_data.json mount,
# data dir wired to ./data/ for easy inspection.
#
# Usage: make dev

services:
  iam:
    build:
      context: .
      dockerfile: Dockerfile
    image: hanzoai/iam:dev
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "9653:9653"
    environment:
      - IAM_DATA_DIR=/data/iam
      - IAM_LISTEN=:8000
      - IAM_ZAP_LISTEN=:9653
      - IAM_ADMIN_ORG=admin
      - IAM_ADMIN_APP=iam
      - IAM_ADMIN_USER=root
      # dev KMS master key — replace via .env for any real testing.
      - IAM_KMS_MASTER_KEY=${IAM_KMS_MASTER_KEY:-dev-master-key-do-not-use-in-prod-please}
    volumes:
      - ./data:/data/iam
      - ./init_data.json:/app/init_data.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/v1/iam/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
