# Hanzo IAM Development Environment
# Local development with PostgreSQL and Redis
# Usage: make dev

services:
  postgres:
    image: ghcr.io/hanzoai/sql:latest
    environment:
      POSTGRES_USER: hanzo
      POSTGRES_PASSWORD: hanzo123
      POSTGRES_DB: hanzo_iam
    ports:
      - "5432:5432"
    volumes:
      - iam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanzo -d hanzo_iam"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - iam_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  iam:
    build:
      context: .
      dockerfile: Dockerfile
      target: STANDARD
    ports:
      - "8000:8000"
    environment:
      RUNNING_IN_DOCKER: "true"
    volumes:
      - ./conf/app.dev.conf:/conf/app.conf:ro
      - ./init_data.json:/init_data.json:ro
      - iam_logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  iam_postgres_data:
  iam_redis_data:
  iam_logs:
