# Hanzo IAM — Multi-Tenant Identity & Access Management
#
# Embedded Base/SQLite. NO PostgreSQL, NO Redis, NO Caddy.
# Per iam/CLAUDE.md: "Data lives in Base — embedded SQLite with
# auto-migrations and replicate-to-S3. Inter-service traffic uses
# native ZAP binary protocol."
#
# Usage:
#   docker compose up -d
#
# Ports:
#   8000 — HTTP (canonical /v1/iam/* surface)
#   9653 — ZAP RPC (service-to-service)

services:
  iam:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/hanzoai/iam:1.14.28
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "9653:9653"
    environment:
      # Canonical IAM_* env contract (no HANZO_ prefix).
      - IAM_DATA_DIR=/data/iam
      - IAM_LISTEN=:8000
      - IAM_ZAP_LISTEN=:9653
      - IAM_ADMIN_ORG=${IAM_ADMIN_ORG:-admin}
      - IAM_ADMIN_APP=${IAM_ADMIN_APP:-iam}
      - IAM_ADMIN_USER=${IAM_ADMIN_USER:-root}
      - IAM_KMS_MASTER_KEY=${IAM_KMS_MASTER_KEY:-}
      - IAM_REPLICATE_BUCKET=${IAM_REPLICATE_BUCKET:-}
      - IAM_REPLICATE_AGE_RECIPIENT=${IAM_REPLICATE_AGE_RECIPIENT:-}
    volumes:
      - ./init_data.json:/app/init_data.json:ro
      - iam_data:/data/iam
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/v1/iam/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  iam_data:
