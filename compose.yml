# Hanzo IAM — Multi-Tenant Identity & Access Management
#
# Docker Compose deployment with Caddy reverse proxy.
# For K8s production, see: universe/infra/k8s/iam/
#
# Domains:
#   iam.hanzo.ai   — Core IAM API
#   hanzo.id       — Hanzo login
#   lux.id         — Lux Network login
#   zoo.id         — Zoo Labs login
#   pars.id        — Pars login
#   id.ad.nexus    — Ad Nexus login
#   id.bootno.de   — Bootnode login
#
# Usage:
#   docker compose up -d

services:
  iam-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/hanzoai/iam:latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-hanzo}:${POSTGRES_PASSWORD:-hanzo}@postgres:5432/${POSTGRES_DB:-iam}?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - IAM_ORIGIN=${IAM_ORIGIN:-https://iam.hanzo.ai}
      - IAM_APP_NAME=iam
      - ENABLE_MULTI_TENANT=true
      - ALLOWED_ORIGINS=hanzo.id,zoo.id,lux.id,pars.id,id.ad.nexus,ad.nexus,id.bootno.de,iam.hanzo.ai
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - ./init_data.json:/app/init_data.json:ro
      - iam_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - iam-network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - iam-backend
    networks:
      - iam-network

  postgres:
