    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-hanzo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hanzo}
      - POSTGRES_DB=${POSTGRES_DB:-iam}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hanzo} -d ${POSTGRES_DB:-iam}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    networks:
      - iam-network

  redis:
    image: ghcr.io/hanzoai/kv:latest
    restart: unless-stopped
    command: kv-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "kv", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - iam-network

volumes:
  iam_data:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:

networks:
  iam-network:
    driver: bridge
