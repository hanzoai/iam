# Hanzo IAM Staging Deployment
# Deploy to stg.hanzo.id for testing

services:
  iam:
    image: ghcr.io/hanzoai/iam:staging
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      RUNNING_IN_DOCKER: "true"
      IAM_DB_HOST: postgres
      IAM_DB_PASSWORD: ${IAM_DB_PASSWORD${IAM_DB_PASSWORD}}
      IAM_REDIS_HOST: redis
    volumes:
      - ./conf/app.staging.conf:/conf/app.conf:ro
      - ./init_data.json:/init_data.json:ro
      - iam_logs:/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.iam.rule=Host(`stg.hanzo.id`)"
      - "traefik.http.routers.iam.entrypoints=websecure"
      - "traefik.http.routers.iam.tls.certresolver=letsencrypt"
      - "traefik.http.services.iam.loadbalancer.server.port=8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: ghcr.io/hanzoai/sql:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hanzo
      POSTGRES_PASSWORD: ${IAM_DB_PASSWORD${IAM_DB_PASSWORD}}
      POSTGRES_DB: hanzo_iam
    volumes:
      - iam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanzo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ghcr.io/hanzoai/kv:latest
    restart: unless-stopped
    command: kv-server --appendonly yes
    volumes:
      - iam_redis_data:/data
    healthcheck:
      test: ["CMD", "kv", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@hanzo.ai"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard for staging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - iam_letsencrypt:/letsencrypt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.stg.hanzo.id`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"

volumes:
  iam_postgres_data:
  iam_redis_data:
  iam_logs:
  iam_letsencrypt:
