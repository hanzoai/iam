# Minimal dev setup - just database services
services:
  postgres:
    image: ghcr.io/hanzoai/sql:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hanzo
      POSTGRES_PASSWORD: hanzo123
      POSTGRES_DB: hanzo_iam
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanzo -d hanzo_iam"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

volumes:
  postgres_dev:
