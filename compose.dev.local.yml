# Hanzo IAM — minimal local-dev compose. No deps to spin up: IAM is
# self-contained on Base/SQLite. This file exists only to declare the
# `iam` service with host networking so you can run other services
# (mpc, kms, console, …) alongside it from the same docker context.
#
# For the full IAM stack with ports/volumes, use compose.dev.yml.

services:
  iam:
    extends:
      file: compose.dev.yml
      service: iam
    network_mode: host
