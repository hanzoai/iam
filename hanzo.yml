# One native build path. The shared CI workflow reads this declaration.
version: 1.34.172
images:
  - name: iam
    context: .
    dockerfile: Dockerfile
    # Written to ghcr.io and pulled as oci.hanzo.ai/hanzoai/iam: oci.hanzo.ai
    # reads through to ghcr.io (universe registry.yaml `proxy:`) and answers a
    # push with 405.
    repo: ghcr.io/hanzoai/iam
    platforms: [linux/amd64, linux/arm64]
test:
  - name: build
    run: |
      set -e
      go build ./...
      make test
