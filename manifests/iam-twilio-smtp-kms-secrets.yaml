# KMS → k8s syncs for the IAM provider credentials the provision Job consumes.
#
# These back provider-sms (Twilio) and provider-email (SMTP). The creds live in
# Hanzo KMS (kms.hanzo.ai). The provision Job reads the resulting k8s Secrets
# via secretKeyRef (see iam-provision-providers-job.yaml).
#
# ZERO plaintext credentials here — every value is sourced from KMS at runtime.
#
# VERIFY BEFORE APPLYING:
#   - The Twilio creds exist in KMS at projectSlug=hanzo, secretsPath
#     /brand/hanzo/twilio with the source key names below (account-sid,
#     auth-token, from-phone). They were seeded across prod/mainnet/testnet/
#     devnet (see ~/.claude memory `twilio-a2p-state`). If your KMS layout uses
#     a different path/key casing, adjust `secretsPath` + `keys` to match — the
#     operator addresses /v1/kms/orgs/hanzo/secrets/<path>/<key>.
#   - The per-app universal-auth identity Secret `hanzo-iam-creds` exists in ns
#     hanzo (provisioned by the kms-operator). Other hanzo syncs use the same
#     per-app `<app>-iam-creds` convention (e.g. hanzo-platform-iam-creds for
#     github-oauth). If IAM's identity Secret has a different name, set it here.
#
# NOTE ON KEY REMAP: the KMSSecret CR copies KMS keys verbatim into the managed
# Secret. The Job expects UPPER_SNAKE keys (ACCOUNT_SID, AUTH_TOKEN, SENDER /
# HOST, PORT, USER, PASS, FROM). KMS stores kebab-case (account-sid, …). The
# operator's keys[] list selects which KMS keys to sync; it does not rename. So
# we list the KMS key names here AND the Job references the SAME names — keep
# the two in lockstep. (If your operator build supports key remapping, prefer
# that; this manifest assumes verbatim copy and therefore the Job's secretKeyRef
# keys below MUST equal the KMS key names. To avoid ambiguity the canonical fix
# is to store the IAM-facing keys in KMS already UPPER_SNAKE under
# /brand/hanzo/twilio and /iam/smtp — do that, then this list and the Job match.)
---
apiVersion: secrets.lux.network/v1alpha1
kind: KMSSecret
metadata:
  name: iam-twilio-kms-sync
  namespace: hanzo
  labels:
    app.kubernetes.io/component: kms-secret
    app.kubernetes.io/part-of: universe
    kms.hanzo.ai/org: hanzo
    kms.hanzo.ai/env: prod
spec:
  hostAPI: http://kms.hanzo.svc
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: hanzo-iam-creds
        secretNamespace: hanzo
      secretsScope:
        projectSlug: hanzo
        envSlug: prod
        secretsPath: /brand/hanzo/twilio
        # KMS source keys. Store these UPPER_SNAKE in KMS so the managed Secret
        # carries ACCOUNT_SID / AUTH_TOKEN / SENDER (what the Job references).
        keys:
          - ACCOUNT_SID
          - AUTH_TOKEN
          - SENDER
  managedSecretReference:
    secretName: iam-twilio
    secretNamespace: hanzo
    secretType: Opaque
    creationPolicy: Orphan
---
apiVersion: secrets.lux.network/v1alpha1
kind: KMSSecret
metadata:
  name: iam-smtp-kms-sync
  namespace: hanzo
  labels:
    app.kubernetes.io/component: kms-secret
    app.kubernetes.io/part-of: universe
    kms.hanzo.ai/org: hanzo
    kms.hanzo.ai/env: prod
spec:
  hostAPI: http://kms.hanzo.svc
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: hanzo-iam-creds
        secretNamespace: hanzo
      secretsScope:
        projectSlug: hanzo
        envSlug: prod
        secretsPath: /iam/smtp
        keys:
          - HOST
          - PORT
          - USER
          - PASS
          - FROM
  managedSecretReference:
    secretName: iam-smtp
    secretNamespace: hanzo
    secretType: Opaque
    creationPolicy: Orphan
