# Cloud Build — Hanzo IAM
#
# Invoke with your tenant's registry + namespace:
#   gcloud builds submit . --project=<your-gcp-project> \
#     --substitutions=_IMAGE=<your-registry>/<your-namespace>/iam:dev,_VITE_APP=<your-app>

substitutions:
  _IMAGE: ghcr.io/hanzoai/iam:dev
  _VITE_APP: app-built-in

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_DEFAULT_APP=${_VITE_APP}'
      - '-t'
      - '${_IMAGE}'
      - '.'

images:
  - '${_IMAGE}'

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
