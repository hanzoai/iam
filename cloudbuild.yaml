# Cloud Build — Hanzo IAM
#
# Downstream consumers (white-label tenants) override `_IMAGE` to point
# at their own registry. Default is ghcr.io/hanzoai (per-org registry
# convention); tenant-specific defaults are NEVER baked into this file.
#
#   gcloud builds submit . --substitutions=_IMAGE=<registry>/<org>/iam:<tag>,_VITE_APP=<app-id>

substitutions:
  _IMAGE: ghcr.io/hanzoai/iam:dev
  _VITE_APP: app-built-in

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_DEFAULT_APP=${_VITE_APP}'
      - '-t'
      - '${_IMAGE}'
      - '.'

images:
  - '${_IMAGE}'

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
