# Cloud Build — Hanzo IAM
#
#   gcloud builds submit . --project=liquidity-devnet \
#     --substitutions=_IMAGE=us-docker.pkg.dev/liquidity-registry//iam:dev,_VITE_APP=liquidity-exchange

substitutions:
  _IMAGE: us-docker.pkg.dev/liquidity-registry//iam:dev
  _VITE_APP: app-built-in

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_DEFAULT_APP=${_VITE_APP}'
      - '-t'
      - '${_IMAGE}'
      - '.'

images:
  - '${_IMAGE}'

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
