name: hanzo-iam
region: nyc
services:
  - name: iam
    github:
      repo: hanzoai/iam
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile.doapp
    instance_size_slug: professional-l
    instance_count: 1
    http_port: 8000
    health_check:
      http_path: /api/health
      initial_delay_seconds: 120
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 5
    envs:
      - key: RUNNING_IN_DOCKER
        value: "true"
        scope: RUN_AND_BUILD_TIME
      - key: dataSourceName
        value: "${IAM_DB_CONNECTION_STRING}"
        scope: RUN_TIME
        type: SECRET

domains:
  - domain: hanzo.id
    type: PRIMARY
  - domain: lux.id
    type: ALIAS
  - domain: zoo.id
    type: ALIAS
  - domain: pars.id
    type: ALIAS
  - domain: id.ad.nexus
    type: ALIAS
  - domain: id.bootno.de
    type: ALIAS
  - domain: iam.hanzo.ai
    type: ALIAS
