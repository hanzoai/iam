# Native CI for the Hanzo Git act_runners (label hanzo-build-linux-amd64).
# Self-contained — no reusable-workflow hub (hanzoai/ci) is on Gitea yet.
# GitHub.com ignores .gitea/workflows, so this never touches the GitHub release
# lanes; it mirrors the `test:` gates in hanzo.yml (go-test + go-lint).
#
# Private modules: github.com/hanzoai/* (e.g. hanzoai/beego) are PRIVATE and a
# direct fetch 128s without auth, so each job authenticates github via the
# UNIVERSE_PAT repo secret (git insteadOf) and marks hanzoai/* GOPRIVATE. luxfi/*
# stays public via the proxy. Pure-Go modernc driver (CGO_ENABLED=0), no
# libsqlcipher. GITHUB_TOKEN is auto-minted per job by Gitea.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  GOPRIVATE: github.com/hanzoai/*

jobs:
  build:
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: go.sum
      - name: auth private modules
        run: git config --global url."https://x-access-token:${{ secrets.UNIVERSE_PAT }}@github.com/".insteadOf "https://github.com/"
      - run: CGO_ENABLED=0 go build -tags skipCi ./...

  test:
    runs-on: hanzo-build-linux-amd64
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: go.sum
      - name: auth private modules
        run: git config --global url."https://x-access-token:${{ secrets.UNIVERSE_PAT }}@github.com/".insteadOf "https://github.com/"
      - run: CGO_ENABLED=0 go test $(go list ./...) -tags skipCi

  lint:
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: go.sum
      - name: auth private modules
        run: git config --global url."https://x-access-token:${{ secrets.UNIVERSE_PAT }}@github.com/".insteadOf "https://github.com/"
      - run: CGO_ENABLED=0 go vet -tags "libsqlite3 sqlite_fts5" ./...
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@v0.7.0
          test -z "$(gofumpt -l .)" || { echo "gofumpt: files need formatting:"; gofumpt -l .; exit 1; }
