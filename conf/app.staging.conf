appname = hanzo-iam
httpport = 8000
runmode = dev
copyrequestbody = true
driverName = postgres
dataSourceName = user=hanzo password=${IAM_DB_PASSWORD${IAM_DB_PASSWORD}} host=postgres port=5432 sslmode=disable dbname=hanzo_iam
dbName = hanzo_iam
tableNamePrefix =
showSql = true
redisEndpoint = redis:6379
defaultStorageProvider =
isCloudIntranet = false
authState = "hanzo"
socks5Proxy =
verificationCodeTimeout = 10
initScore = 0
logPostOnly = true
isUsernameLowered = false
origin = https://stg.hanzo.id
originFrontend = https://stg.hanzo.id
staticBaseUrl = "https://cdn.hanzo.ai"
isDemoMode = false
batchSize = 100
enableErrorMask = false
enableGzip = true
inactiveTimeoutMinutes = 30
ldapServerPort = 389
ldapsCertId = ""
ldapsServerPort = 636
radiusServerPort = 1812
radiusDefaultOrganization = "hanzo"
radiusSecret = ${IAM_RADIUS_SECRET}
quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}
logConfig = {"adapter":"file", "filename": "logs/hanzo-iam.log", "maxdays":99999, "perm":"0770"}
initDataNewOnly = true
initDataFile = "./init_data.json"
frontendBaseDir = "../iam"
