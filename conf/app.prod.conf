appname = hanzo-iam
httpport = 8000
runmode = prod
copyrequestbody = true
driverName = sqlite
# Plaintext fallback DSN — used ONLY when orgIsolation != sqlite OR no master key
# is set. Under orgIsolation = sqlite + IAM_KMS_MASTER_KEY, the global iam.db at
# {dataDir}/iam.db is opened ENVELOPE-ENCRYPTED (its own DEK wrapped under a
# KMS-derived KEK) and this DSN is bypassed. cache=shared is dropped on the
# encrypted path (the shared page cache holds decrypted pages — an isolation
# hazard across keys).
dataSourceName = file:data/iam.db?_journal_mode=WAL&_busy_timeout=5000&cache=shared
dbName =
orgIsolation = sqlite
dataDir = data
# ─── ENCRYPTION AT REST — operator action REQUIRED ───────────────────────────
# At-rest encryption is OFF until the Deployment injects IAM_KMS_MASTER_KEY
# (64 hex chars = 32 bytes), sourced from KMS via a KMSSecret CR — NEVER a raw
# value in a manifest. With it set:
#   • the global iam.db and every per-org {dataDir}/orgs/{slug}/iam.db are
#     SQLCipher-encrypted (envelope DEK in a <db>.dek sidecar);
#   • master-key rotation only rewraps the sidecars (OrgDBManager.Rewrap) —
#     pages are never rewritten, so rotation cannot brick a file.
# Without it (and a CGO+libsqlcipher build) the per-org manager refuses to start
# rather than silently write plaintext. The operator/universe Deployment MUST
# set IAM_KMS_MASTER_KEY from KMS for any environment that stores real data.
tableNamePrefix =
showSql = false
defaultStorageProvider =
isCloudIntranet = false
authState = "hanzo"
socks5Proxy =
verificationCodeTimeout = 10
initScore = 0
logPostOnly = true
isUsernameLowered = false
origin =
originFrontend =
staticBaseUrl = ""
batchSize = 100
enableErrorMask = true
enableGzip = true
inactiveTimeoutMinutes = 30
ldapServerPort = 389
ldapsCertId = ""
ldapsServerPort = 636
radiusServerPort = 1812
radiusDefaultOrganization = "hanzo"
radiusSecret = ${IAM_RADIUS_SECRET}
quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}
logConfig = {"adapter":"console"}
initDataNewOnly = true
initDataFile = "./init_data.json"
frontendBaseDir = "./web"
# KMS is configured via environment:
#   BASE_KMS_NODES       CSV of MPC ZAP addrs (host:9651)
#   BASE_KMS_ORG_SLUG    Organization identifier for CEK derivation
#   BASE_KMS_THRESHOLD   t-of-n threshold (default: ceil(n/2)+1)
#   BASE_KMS_PASSPHRASE  Unlock passphrase (sourced from K8s secret)
