appname = hanzo-iam
httpport = 8000
runmode = prod
copyrequestbody = true
driverName = sqlite
dataSourceName = file:data/iam.db?_journal_mode=WAL&_busy_timeout=5000&cache=shared
dbName =
orgIsolation = sqlite
dataDir = data
tableNamePrefix =
showSql = false
defaultStorageProvider =
isCloudIntranet = false
authState = "hanzo"
socks5Proxy =
verificationCodeTimeout = 10
initScore = 0
logPostOnly = true
isUsernameLowered = false
origin =
originFrontend =
staticBaseUrl = "https://cdn.hanzo.ai"
isDemoMode = false
batchSize = 100
enableErrorMask = true
enableGzip = true
inactiveTimeoutMinutes = 30
ldapServerPort = 389
ldapsCertId = ""
ldapsServerPort = 636
radiusServerPort = 1812
radiusDefaultOrganization = "hanzo"
radiusSecret = ${IAM_RADIUS_SECRET}
quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}
logConfig = {"adapter":"console"}
initDataNewOnly = true
initDataFile = "./init_data.json"
frontendBaseDir = "./web"
# KMS is configured via environment:
#   BASE_KMS_NODES       CSV of MPC ZAP addrs (host:9651)
#   BASE_KMS_ORG_SLUG    Organization identifier for CEK derivation
#   BASE_KMS_THRESHOLD   t-of-n threshold (default: ceil(n/2)+1)
#   BASE_KMS_PASSPHRASE  Unlock passphrase (sourced from K8s secret)
